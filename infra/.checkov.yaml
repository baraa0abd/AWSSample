# Every skip is a deliberate decision; see docs/ADR.md (ADR-9).
framework: [terraform]
quiet: true
compact: true
skip-path: [.terraform]
skip-check:
  - CKV2_AZURE_31  # false positive: the NSG is attached in modules/security, checkov does not follow module outputs
  - CKV_AZURE_119  # the server NIC has a public IP by design: it is the ingress node and SSH jump host
  - CKV_AZURE_160  # port 80 is open for ACME HTTP-01 challenges and HTTP->HTTPS traffic
  - CKV_AZURE_59   # public endpoint stays on, but the storage firewall is default-deny (subnet + admin IPs only)
  - CKV_AZURE_189  # same for Key Vault: default-deny firewall, admin IPs only
  - CKV2_AZURE_33 # service endpoint + firewall instead of a private endpoint (cost; revisit for prod)
  - CKV2_AZURE_32  # same for Key Vault
  - CKV2_AZURE_1   # platform-managed encryption keys; no CMK requirement
  - CKV_AZURE_93   # same for managed disks
  - CKV_AZURE_206  # LRS: snapshots also exist on the server disk; GRS is a prod cost decision
  - CKV_AZURE_33   # no queue service in use
  - CKV2_AZURE_21  # storage diagnostic logs belong to the Azure Monitor integration (next steps)
