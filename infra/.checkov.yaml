# Every skip is a deliberate decision; see docs/ADR.md (ADR-9).
framework: [terraform]
quiet: true
compact: true
skip-path: [.terraform]
skip-check:
  - CKV2_AWS_5   # false positive: the security group is attached in modules/compute, checkov does not follow module outputs
  - CKV2_AWS_11  # VPC flow logs belong to the CloudWatch integration (next steps); they cost per GB
  - CKV_AWS_126  # detailed (1-minute) EC2 monitoring is paid; node-exporter already gives 30 s resolution
  - CKV_AWS_145  # S3-managed encryption keys (SSE-S3); no customer-managed-key requirement
  - CKV_AWS_189  # same for EBS volumes: encrypted with the AWS-managed key
  - CKV_AWS_297  # same for the shutdown schedule, which contains only instance IDs
  - CKV_AWS_144  # no cross-region replication: snapshots also exist on the server disk; a prod cost decision
  - CKV_AWS_18   # S3 access logging needs a second bucket; revisit with the CloudWatch integration
  - CKV2_AWS_62  # nothing consumes bucket event notifications
