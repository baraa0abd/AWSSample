---
# provision (OpenTofu) -> configure (this playbook) -> deploy (Helm).
# Every role has a tag of the same name: `ansible-playbook site.yml --tags k3s_agent`.

- name: Baseline every host
  hosts: k3s_server:k3s_agent:build
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for SSH on freshly created VMs
      ansible.builtin.wait_for_connection:
        timeout: 300
      tags: always
    - name: Wait for cloud-init to release apt
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false
      tags: always
    - name: Gather facts
      ansible.builtin.setup:
      tags: always
  roles:
    - role: common
      tags: common

- name: Data disks on cluster nodes
  hosts: k3s_server:k3s_agent
  become: true
  roles:
    - role: disks
      tags: disks

- name: Docker on build hosts
  hosts: build
  become: true
  roles:
    - role: docker
      tags: docker

- name: K3s server
  hosts: k3s_server
  become: true
  roles:
    - role: k3s_server
      tags: k3s_server

- name: K3s agents
  hosts: k3s_agent
  become: true
  roles:
    - role: k3s_agent
      tags: k3s_agent

- name: Verify cluster health
  hosts: k3s_server
  become: true
  gather_facts: false
  tasks:
    - name: All nodes are Ready
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=300s
      changed_when: false
      tags: [verify, k3s_server, k3s_agent]
