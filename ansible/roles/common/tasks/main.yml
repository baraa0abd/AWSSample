---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Harden sshd
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    # 00- sorts before 50-cloud-init.conf: sshd keeps the first value it reads.
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Load kernel modules required by Kubernetes
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: "{{ common_kernel_modules }}"

- name: Apply sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-kubernetes.conf
    state: present
  loop: "{{ common_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Configure fail2ban for sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h
      # Never ban the cluster itself (Ansible reaches agents through the server).
      ignoreip = 127.0.0.1/8 {{ network_cidr }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started

# UFW opens the same ports as the security group, so a mistake in either layer is not enough to expose
# anything else. *Who* may reach SSH and the API is decided in one place only (the security group):
# duplicating the admin IP list here would lock you out of the nodes when your IP changes.
- name: Set UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    default: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
    # Pod traffic is forwarded, not addressed to the host: must be allowed or the CNI breaks.
    - { direction: routed, policy: allow }
  loop_control:
    label: "{{ item.direction }} {{ item.policy }}"

- name: Allow all traffic from the VPC and cluster networks
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
  loop: "{{ common_trusted_cidrs }}"

- name: Allow SSH, K3s API, HTTP and HTTPS
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ item }}"
  loop: "{{ common_open_tcp_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
