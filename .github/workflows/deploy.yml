name: deploy

# Reusable: deploys the image built from this commit to one environment.
# Environment secrets: KUBECONFIG_B64 (base64 of .kube/<env>.yaml), SOPS_AGE_KEY,
#   GHCR_PULL_TOKEN (PAT with read:packages - the job token expires, the cluster needs a durable one).
# Environment variables: DOMAIN, ACME_EMAIL (optional).
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency: deploy-${{ inputs.environment }}
    env:
      ENV: ${{ inputs.environment }}
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/webapp
      IMAGE_TAG: ${{ github.sha }}
      SG_NAME: ${{ vars.PROJECT }}-${{ inputs.environment }}-nodes-sg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: install sops
        run: |
          curl -fsSL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          chmod +x /usr/local/bin/sops
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # The K3s API only accepts admin CIDRs. Let this one runner in for the length of the job.
      - name: open the K3s API to this runner
        run: |
          sg_id=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=$SG_NAME" \
            --query 'SecurityGroups[0].GroupId' --output text)
          cidr="$(curl -fsS https://checkip.amazonaws.com)/32"
          aws ec2 authorize-security-group-ingress --group-id "$sg_id" --protocol tcp --port 6443 --cidr "$cidr"
          { echo "SG_ID=$sg_id"; echo "RUNNER_CIDR=$cidr"; } >> "$GITHUB_ENV"
      - name: deploy
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DOMAIN: ${{ vars.DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
        run: |
          mkdir -p .kube && (umask 077; echo "$KUBECONFIG_B64" | base64 -d > ".kube/${ENV}.yaml")
          bash scripts/deploy.sh
      - name: close the K3s API again
        if: always() && env.SG_ID != ''
        run: aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --protocol tcp --port 6443 --cidr "$RUNNER_CIDR"
