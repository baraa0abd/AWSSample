name: infra

# PR: lint + plan (posted as a comment). main / manual: plan + apply behind the environment's
# required reviewers. AWS auth is OIDC only (see infra/bootstrap/oidc.sh): no access keys exist.
on:
  pull_request:
    paths: ["infra/**", "scripts/ci-preflight.sh", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "scripts/ci-preflight.sh", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

env:
  TOFU_VERSION: 1.13.0
  TF_IN_AUTOMATION: "true"

jobs:
  cloud-status:
    runs-on: ubuntu-24.04
    steps:
      - name: report cloud infrastructure mode
        env:
          AWS_ENABLED: ${{ vars.AWS_ENABLED }}
        run: |
          if [ "$AWS_ENABLED" = true ]; then
            echo 'AWS plan/apply enabled; configuration will be validated before AWS authentication.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'AWS plan/apply disabled. Static checks still run. Configure AWS and set AWS_ENABLED=true to provision.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: fmt
        run: tofu fmt -check -recursive infra
      - name: validate
        run: |
          for env in dev prod; do
            tofu -chdir=infra/environments/$env init -backend=false -input=false
            tofu -chdir=infra/environments/$env validate
          done
      - name: tflint
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download rate limit
        run: tflint --init && tflint --recursive --config "$PWD/.tflint.hcl"
      - name: checkov
        run: pipx run checkov==3.3.27 -d infra --config-file infra/.checkov.yaml

  plan:
    if: github.event_name == 'pull_request' && vars.AWS_ENABLED == 'true'
    needs: lint
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_project_name: ${{ vars.PROJECT }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_allowed_admin_cidrs: ${{ vars.ADMIN_CIDRS }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      BACKEND_ARGS: >-
        -backend-config=bucket=${{ vars.TFSTATE_BUCKET }}
        -backend-config=region=${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
    permissions:
      contents: read
      id-token: write # OIDC token for AWS
      pull-requests: write # plan comment
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: validate AWS configuration
        run: bash scripts/ci-preflight.sh infra
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: plan
        id: plan
        working-directory: infra/environments/${{ matrix.environment }}
        run: |
          # shellcheck disable=SC2086  # BACKEND_ARGS is several arguments on purpose
          tofu init -input=false $BACKEND_ARGS
          set -o pipefail
          tofu plan -input=false -no-color -lock=false | tee plan.txt
      - name: comment plan on the PR
        if: always() && steps.plan.outcome != 'skipped'
        working-directory: infra/environments/${{ matrix.environment }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENV: ${{ matrix.environment }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### OpenTofu plan: $TARGET_ENV"
            echo '~~~'
            tail -c 60000 plan.txt # GitHub caps comments at 65k characters
            echo '~~~'
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md

  apply:
    if: github.event_name != 'pull_request' && vars.AWS_ENABLED == 'true'
    needs: lint
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_project_name: ${{ vars.PROJECT }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_allowed_admin_cidrs: ${{ vars.ADMIN_CIDRS }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      BACKEND_ARGS: >-
        -backend-config=bucket=${{ vars.TFSTATE_BUCKET }}
        -backend-config=region=${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
    # Manual approval: configure "Required reviewers" on the dev/prod GitHub environments.
    # A push to main only ever targets dev; prod is applied by manual dispatch.
    environment: ${{ inputs.environment || 'dev' }}
    concurrency: infra-${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: validate AWS configuration
        run: bash scripts/ci-preflight.sh infra
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: plan and apply
        working-directory: infra/environments/${{ inputs.environment || 'dev' }}
        run: |
          # shellcheck disable=SC2086  # BACKEND_ARGS is several arguments on purpose
          tofu init -input=false $BACKEND_ARGS
          tofu plan -input=false -out=tfplan
          tofu apply -input=false tfplan
